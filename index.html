<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<title>Touch Controller</title>
<style>
  :root {
    --bg: #0a0b0f;
    --surface: rgba(255,255,255,0.05);
    --surface-strong: rgba(255,255,255,0.09);
    --line: rgba(255,255,255,0.1);
    --text: #eef0f4;
    --text-dim: rgba(238,240,244,0.4);
    --accent: #4fe3a1;
    --y: #e7c14d;
    --a: #4fe3a1;
    --x: #4d9be7;
    --b: #e75d5d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: none; user-select: none; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    overflow: hidden; overscroll-behavior: none; position: fixed; inset: 0;
  }

  #status {
    position: fixed; top: max(6px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    font-size: 9px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    padding: 4px 10px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line);
    z-index: 200; display: flex; align-items: center; gap: 5px; color: var(--text-dim);
  }
  #status::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--text-dim); }
  #status.connected { color: var(--accent); }
  #status.connected::before { background: var(--accent); box-shadow: 0 0 5px var(--accent); }
  #status.disconnected::before { background: var(--b); }
  #status.disconnected { color: var(--b); }


  #connection-panel {
    display: none; position: fixed; inset: 0; z-index: 400;
    background: rgba(0,0,0,.72); align-items: center; justify-content: center;
    padding: 20px; touch-action: auto;
  }
  #connection-panel.open { display: flex; }
  #connection-card {
    width: min(360px, 92vw); padding: 20px; border-radius: 18px;
    background: #15171d; border: 1px solid var(--line);
    box-shadow: 0 20px 60px rgba(0,0,0,.5); touch-action: auto;
  }
  .connection-title { font-size: 13px; font-weight: 800; letter-spacing: .12em; }
  .connection-subtitle { margin-top: 7px; font-size: 11px; color: var(--text-dim); }
  #pc-address {
    width: 100%; margin-top: 16px; padding: 12px 13px; border-radius: 11px;
    border: 1px solid var(--line); outline: none; background: #0d0f14;
    color: var(--text); font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    touch-action: auto; user-select: text;
  }
  #pc-address:focus { border-color: rgba(79,227,161,.55); }
  .connection-actions { display: flex; gap: 8px; margin-top: 10px; }
  .connection-actions button {
    flex: 1; padding: 11px; border-radius: 11px; border: 1px solid var(--line);
    background: var(--surface); color: var(--text); font-size: 11px; font-weight: 800;
  }
  #connect-btn { background: rgba(79,227,161,.14); color: var(--accent); border-color: rgba(79,227,161,.35); }
  #connection-help { margin-top: 10px; font-size: 9px; color: var(--text-dim); }

  #rotate-overlay {
    display: none; position: fixed; inset: 0; z-index: 500; background: var(--bg); color: var(--text);
    flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px;
  }
  #rotate-overlay svg { width: 40px; height: 40px; opacity: .6; animation: rotateHint 1.8s ease-in-out infinite; }
  #rotate-overlay p { margin: 0; font-size: 13px; color: var(--text-dim); }
  @keyframes rotateHint { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } }
  @media (orientation: portrait) { #rotate-overlay { display: flex; } #app { display: none; } }

  #app {
    position: fixed; inset: 0;
    padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right))
             max(8px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    display: flex; flex-direction: column; justify-content: space-between;
  }

  /* ---- Top row: LT/LB | back/menu | RT/RB + ABXY ---- */
  .top-row { display: flex; justify-content: space-between; align-items: flex-start; }
  .lr-stack { display: flex; flex-direction: column; gap: 6px; width: clamp(46px, 9vw, 66px); }
  .flat-btn {
    background: var(--surface); border: 1px solid var(--line); border-radius: 22px;
    color: var(--text-dim); font-weight: 600; font-size: clamp(9px, 1.8vw, 11px);
    text-align: center; padding: clamp(6px, 1.4vh, 9px) 0;
  }
  .flat-btn.active { background: rgba(79,227,161,0.14); color: var(--accent); border-color: rgba(79,227,161,0.35); }

  .center-icons { display: flex; gap: 22px; align-items: center; margin-top: clamp(4px, 1vh, 10px); }
  .icon-btn {
    width: 30px; height: 30px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; color: var(--text-dim);
  }
  .icon-btn.active { color: var(--accent); border-color: rgba(79,227,161,0.35); background: rgba(79,227,161,0.14); }
  .icon-btn svg { width: 15px; height: 15px; }

  .rt-abxy-group { display: flex; align-items: flex-start; gap: clamp(8px, 2vw, 16px); }
  .face-diamond { width: clamp(96px, 22vh, 140px); height: clamp(96px, 22vh, 140px); position: relative; }
  .face-btn {
    position: absolute; width: 32%; height: 32%; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-weight: 700;
    font-size: clamp(12px, 2.4vh, 15px); border: 1px solid var(--line); background: var(--surface); color: var(--text-dim);
  }
  #btn-y.active { background: rgba(231,193,77,0.16); color: var(--y); border-color: rgba(231,193,77,0.4); }
  #btn-a.active { background: rgba(79,227,161,0.16); color: var(--a); border-color: rgba(79,227,161,0.4); }
  #btn-x.active { background: rgba(77,155,231,0.16); color: var(--x); border-color: rgba(77,155,231,0.4); }
  #btn-b.active { background: rgba(231,93,93,0.16); color: var(--b); border-color: rgba(231,93,93,0.4); }
  #btn-y { top: 0; left: 34%; }
  #btn-a { bottom: 0; left: 34%; }
  #btn-x { top: 34%; left: 0; }
  #btn-b { top: 34%; right: 0; }

  /* ---- Bottom row: dpad (left) + big stick (right) ---- */
  .bottom-row { flex: 1; display: flex; align-items: flex-end; justify-content: space-between; padding-bottom: 1vh; }

  .dpad { width: clamp(96px, 24vh, 150px); height: clamp(96px, 24vh, 150px); position: relative; }
  .dpad-btn {
    position: absolute; background: var(--surface); border: 1px solid var(--line); color: var(--text-dim);
    display: flex; align-items: center; justify-content: center; font-size: clamp(13px, 2.8vh, 17px);
    width: 36%; height: 36%;
  }
  .dpad-btn.active { background: rgba(79,227,161,0.14); color: var(--accent); border-color: rgba(79,227,161,0.35); }
  .dpad-up { top: 0; left: 32%; border-radius: 10px 10px 3px 3px; }
  .dpad-down { bottom: 0; left: 32%; border-radius: 3px 3px 10px 10px; }
  .dpad-left { top: 32%; left: 0; border-radius: 10px 3px 3px 10px; }
  .dpad-right { top: 32%; right: 0; border-radius: 3px 10px 10px 3px; }

  .stick-zone {
    width: clamp(150px, 34vh, 210px); height: clamp(150px, 34vh, 210px); border-radius: 50%;
    background: var(--surface); border: 1px solid var(--line);
    position: relative; display: flex; align-items: center; justify-content: center;
  }
  .stick-zone.dragging { border-color: rgba(79,227,161,0.35); }
  .stick-thumb {
    width: 40%; height: 40%; border-radius: 50%; background: var(--surface-strong);
    border: 1px solid var(--line); position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  }
  .stick-zone.dragging .stick-thumb { background: rgba(79,227,161,0.22); border-color: rgba(79,227,161,0.4); }
</style>
</head>
<body>

<div id="status" class="disconnected">offline</div>

<div id="rotate-overlay">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M9 20h6" stroke-linecap="round"/></svg>
  <p>Rotate your phone to landscape<br>to use the controller</p>
</div>

<div id="app">
  <div class="top-row">
    <div class="lr-stack">
      <div class="flat-btn" data-btn="LT" id="LT">LT</div>
      <div class="flat-btn" data-btn="LB" id="LB">LB</div>
    </div>

    <div class="center-icons">
      <div class="icon-btn" data-btn="BACK" id="BACK">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="12" rx="2"/></svg>
      </div>
      <div class="icon-btn" data-btn="START" id="START">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
      </div>
    </div>

    <div class="rt-abxy-group">
      <div class="lr-stack">
        <div class="flat-btn" data-btn="RT" id="RT">RT</div>
        <div class="flat-btn" data-btn="RB" id="RB">RB</div>
      </div>
      <div class="face-diamond">
        <div class="face-btn" id="btn-y" data-btn="Y">Y</div>
        <div class="face-btn" id="btn-a" data-btn="A">A</div>
        <div class="face-btn" id="btn-x" data-btn="X">X</div>
        <div class="face-btn" id="btn-b" data-btn="B">B</div>
      </div>
    </div>
  </div>

  <div class="bottom-row">
    <div class="dpad">
      <div class="dpad-btn dpad-up" data-btn="DPAD_UP">▲</div>
      <div class="dpad-btn dpad-down" data-btn="DPAD_DOWN">▼</div>
      <div class="dpad-btn dpad-left" data-btn="DPAD_LEFT">◀</div>
      <div class="dpad-btn dpad-right" data-btn="DPAD_RIGHT">▶</div>
    </div>

    <div class="stick-zone" id="stick-right">
      <div class="stick-thumb" id="thumb-right"></div>
    </div>
  </div>
</div>

<!-- IMPORTANT: socket.io.min.js must be bundled with the APK and placed next to this HTML file. -->
<script src="./socket.io.min.js"></script>
<script>
const statusEl = document.getElementById('status');
const connectionPanel = document.getElementById('connection-panel');
const pcAddressInput = document.getElementById('pc-address');
const connectBtn = document.getElementById('connect-btn');
const closeConnectBtn = document.getElementById('close-connect-btn');

let socket = null;

function normalizeServerAddress(value) {
  value = (value || '').trim();
  if (!value) return '';
  if (!/^https?:\/\//i.test(value)) value = 'http://' + value;
  try {
    const u = new URL(value);
    if (!u.port) u.port = '5000';
    return u.origin;
  } catch {
    return '';
  }
}

function setOffline() {
  statusEl.textContent = 'offline';
  statusEl.className = 'disconnected';
}

function connectToPC() {
  const address = normalizeServerAddress(pcAddressInput.value);
  if (!address || typeof io !== 'function') {
    statusEl.textContent = 'set PC';
    statusEl.className = 'disconnected';
    connectionPanel.classList.add('open');
    return;
  }

  localStorage.setItem('controller_pc_address', address);
  if (socket) {
    try { socket.disconnect(); } catch (_) {}
  }

  statusEl.textContent = 'connecting';
  statusEl.className = '';

  socket = io(address, {
    transports: ['websocket', 'polling'],
    reconnection: true,
    reconnectionAttempts: Infinity,
    timeout: 5000
  });

  socket.on('connect', () => {
    statusEl.textContent = 'connected';
    statusEl.className = 'connected';
    connectionPanel.classList.remove('open');
  });
  socket.on('disconnect', setOffline);
  socket.on('connect_error', () => {
    statusEl.textContent = 'check PC';
    statusEl.className = 'disconnected';
  });
}

function openConnectionPanel() {
  pcAddressInput.value = localStorage.getItem('controller_pc_address') || '';
  connectionPanel.classList.add('open');
  setTimeout(() => pcAddressInput.focus(), 50);
}

connectBtn.addEventListener('click', connectToPC);
closeConnectBtn.addEventListener('click', () => connectionPanel.classList.remove('open'));
pcAddressInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') connectToPC();
});
statusEl.addEventListener('click', openConnectionPanel);

const savedAddress = localStorage.getItem('controller_pc_address');
if (savedAddress) {
  pcAddressInput.value = savedAddress;
  connectToPC();
} else {
  statusEl.textContent = 'set PC';
  statusEl.className = 'disconnected';
}

/* Safe emit wrapper: controller UI can load even before a PC is connected. */
function emit(event, data) {
  if (socket && socket.connected) socket.emit(event, data);
}

function wireButton(el, sendName) {
  const press = (e) => { e.preventDefault(); el.classList.add('active'); emit('button', { name: sendName, pressed: true }); };
  const release = (e) => { e.preventDefault(); el.classList.remove('active'); emit('button', { name: sendName, pressed: false }); };
  el.addEventListener('touchstart', press, { passive: false });
  el.addEventListener('touchend', release, { passive: false });
  el.addEventListener('touchcancel', release, { passive: false });
  el.addEventListener('mousedown', press);
  el.addEventListener('mouseup', release);
  el.addEventListener('mouseleave', release);
}

document.querySelectorAll('[data-btn]').forEach(el => {
  const name = el.dataset.btn;
  if (name === 'LT' || name === 'RT') {
    const side = name === 'LT' ? 'left' : 'right';
    const press = (e) => { e.preventDefault(); el.classList.add('active'); emit('trigger', { side, value: 1.0 }); };
    const release = (e) => { e.preventDefault(); el.classList.remove('active'); emit('trigger', { side, value: 0.0 }); };
    el.addEventListener('touchstart', press, { passive: false });
    el.addEventListener('touchend', release, { passive: false });
    el.addEventListener('touchcancel', release, { passive: false });
    el.addEventListener('mousedown', press);
    el.addEventListener('mouseup', release);
    el.addEventListener('mouseleave', release);
  } else {
    wireButton(el, name);
  }
});

// ---- Single right stick (also usable as movement — drives the right analog axis) ----
function setupStick(zoneId, thumbId, side) {
  const zone = document.getElementById(zoneId);
  const thumb = document.getElementById(thumbId);
  let dragging = false, moved = false;

  function radius() { return zone.clientWidth / 2; }
  function updateThumb(dx, dy) {
    const r = radius();
    const dist = Math.min(Math.hypot(dx, dy), r - 8);
    const angle = Math.atan2(dy, dx);
    const cx = Math.cos(angle) * dist, cy = Math.sin(angle) * dist;
    thumb.style.transform = `translate(calc(-50% + ${cx}px), calc(-50% + ${cy}px))`;
    emit('stick', { side, x: cx / (r - 8), y: -cy / (r - 8) });
  }
  function resetThumb() { thumb.style.transform = 'translate(-50%, -50%)'; emit('stick', { side, x: 0, y: 0 }); }
  function getRelative(clientX, clientY) {
    const rect = zone.getBoundingClientRect();
    return { dx: clientX - (rect.left + rect.width / 2), dy: clientY - (rect.top + rect.height / 2) };
  }
  function start(x, y) { dragging = true; moved = false; zone.classList.add('dragging'); const {dx,dy} = getRelative(x,y); updateThumb(dx,dy); }
  function move(x, y) { if (!dragging) return; moved = true; const {dx,dy} = getRelative(x,y); updateThumb(dx,dy); }
  function end() {
    if (dragging && !moved) {
      const btnName = side === 'left' ? 'LS' : 'RS';
      emit('button', { name: btnName, pressed: true });
      setTimeout(() => emit('button', { name: btnName, pressed: false }), 80);
    }
    dragging = false; zone.classList.remove('dragging'); resetThumb();
  }

  zone.addEventListener('touchstart', (e) => { e.preventDefault(); const t = e.touches[0]; start(t.clientX, t.clientY); }, { passive: false });
  zone.addEventListener('touchmove', (e) => { e.preventDefault(); const t = e.touches[0]; move(t.clientX, t.clientY); }, { passive: false });
  zone.addEventListener('touchend', (e) => { e.preventDefault(); end(); }, { passive: false });
  zone.addEventListener('touchcancel', (e) => { e.preventDefault(); end(); }, { passive: false });
  zone.addEventListener('mousedown', (e) => start(e.clientX, e.clientY));
  window.addEventListener('mousemove', (e) => { if (dragging) move(e.clientX, e.clientY); });
  window.addEventListener('mouseup', () => { if (dragging) end(); });
}
setupStick('stick-right', 'thumb-right', 'right');

document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', (e) => e.preventDefault());
if (screen.orientation && screen.orientation.lock) { screen.orientation.lock('landscape').catch(() => {}); }
</script>

</body>
</html>
