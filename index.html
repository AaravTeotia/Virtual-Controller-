<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Touch Controller</title>

<style>
:root {
  --bg: #f4f5f7; /* Light theme background matching the image */
  --btn-bg: #111111;
  --btn-border: #2a2a2a;
  --text: #ffffff;
  
  --green: #6bc04b;
  --yellow: #e4c332;
  --blue: #3880c4;
  --red: #d13d3d;
  
  --stick-size: clamp(100px, 25vh, 140px);
  --dpad-size: clamp(100px, 25vh, 140px);
  --abxy-zone: clamp(120px, 30vh, 160px);
  --face-btn-size: clamp(35px, 8vh, 45px);
  --small-btn-size: clamp(28px, 6vh, 36px);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  user-select: none;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  position: fixed;
  inset: 0;
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

/* STATUS & CONNECTION (Preserved styling but adapted for light theme) */
#status {
  position: fixed;
  top: max(6px, env(safe-area-inset-top));
  left: 50%;
  transform: translateX(-50%);
  z-index: 200;
  padding: 4px 10px;
  border-radius: 20px;
  background: rgba(0,0,0,0.1);
  border: 1px solid rgba(0,0,0,0.2);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: #555;
}

#status::before {
  content: "";
  display: inline-block;
  width: 5px;
  height: 5px;
  margin-right: 5px;
  border-radius: 50%;
  background: #555;
}

#status.connected { color: #2e8b57; }
#status.connected::before { background: #2e8b57; box-shadow: 0 0 5px #2e8b57; }
#status.disconnected { color: #b22222; }
#status.disconnected::before { background: #b22222; }

#connection-panel {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 400;
  background: rgba(0,0,0,.72);
  align-items: center;
  justify-content: center;
  padding: 20px;
  touch-action: auto;
}

#connection-panel.open { display: flex; }

#connection-card {
  width: min(360px, 92vw);
  padding: 20px;
  border-radius: 18px;
  background: #ffffff;
  border: 1px solid #ccc;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
  touch-action: auto;
}

.connection-title { font-size: 13px; font-weight: 800; letter-spacing: .12em; color: #111; }
.connection-subtitle { margin-top: 7px; font-size: 11px; color: #666; }

#pc-address {
  width: 100%;
  margin-top: 16px;
  padding: 12px 13px;
  border-radius: 11px;
  border: 1px solid #ccc;
  outline: none;
  background: #f9f9f9;
  color: #111;
  font: 600 14px sans-serif;
  touch-action: auto;
  user-select: text;
}

.connection-actions { display: flex; gap: 8px; margin-top: 10px; }
.connection-actions button {
  flex: 1;
  padding: 11px;
  border-radius: 11px;
  border: 1px solid #ccc;
  background: #eee;
  color: #111;
  font-size: 11px;
  font-weight: 800;
}

#connect-btn { background: rgba(107, 192, 75, 0.2); color: #2e8b57; border-color: #2e8b57; }
#connection-help { margin-top: 10px; font-size: 9px; color: #666; }

#rotate-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 500;
  background: var(--bg);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  text-align: center;
}
#rotate-overlay p { margin: 0; font-size: 13px; color: #333; }
@media (orientation: portrait) {
  #rotate-overlay { display: flex; }
  #app { display: none; }
}

/* APP CONTAINER */
#app {
  position: fixed;
  inset: 0;
  padding: max(10px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
}

/* COMMON BUTTON STYLES (Matched to IMG) */
.btn-round {
  background: var(--btn-bg);
  border: 2px solid var(--btn-border);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text);
  font-weight: 800;
  box-shadow: inset 0 2px 4px rgba(255,255,255,0.1), 0 4px 6px rgba(0,0,0,0.3);
}

.btn-round.active {
  background: #333;
  transform: scale(0.95);
  box-shadow: 0 1px 2px rgba(0,0,0,0.5);
}

/* ANALOG STICKS */
.stick-zone {
  position: absolute;
  width: var(--stick-size);
  height: var(--stick-size);
  border-radius: 50%;
  background: #0a0a0a;
  box-shadow: inset 0 6px 10px rgba(0,0,0,0.8), 0 2px 5px rgba(0,0,0,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 20;
}

.stick-thumb {
  width: 50%;
  height: 50%;
  border-radius: 50%;
  background: #1a1a1a;
  border: 1px solid #333;
  box-shadow: inset 0 2px 5px rgba(255,255,255,0.1), 0 5px 15px rgba(0,0,0,0.6);
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

#stick-left { top: 12%; left: 8%; }
#stick-right { bottom: 12%; right: 28%; }

/* DPAD (Plus shape matched to IMG with blue center) */
.dpad {
  position: absolute;
  bottom: 12%;
  left: 28%;
  width: var(--dpad-size);
  height: var(--dpad-size);
  z-index: 20;
}

.dpad-cross {
  position: relative;
  width: 100%;
  height: 100%;
  background: 
    linear-gradient(to bottom, transparent 33.33%, var(--btn-bg) 33.33%, var(--btn-bg) 66.66%, transparent 66.66%),
    linear-gradient(to right, transparent 33.33%, var(--btn-bg) 33.33%, var(--btn-bg) 66.66%, transparent 66.66%);
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.4);
}

.dpad-cross::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 20%;
  height: 20%;
  background: radial-gradient(circle, rgba(56,128,196,0.8) 0%, transparent 70%);
  pointer-events: none;
}

.dpad-btn {
  position: absolute;
  width: 33.33%;
  height: 33.33%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.dpad-btn.active {
  background: rgba(255,255,255,0.15);
}

.dpad-up { top: 0; left: 33.33%; border-radius: 8px 8px 0 0; }
.dpad-down { bottom: 0; left: 33.33%; border-radius: 0 0 8px 8px; }
.dpad-left { top: 33.33%; left: 0; border-radius: 8px 0 0 8px; }
.dpad-right { top: 33.33%; right: 0; border-radius: 0 8px 8px 0; }

/* ABXY DIAMOND */
.face-diamond {
  position: absolute;
  top: 12%;
  right: 5%;
  width: var(--abxy-zone);
  height: var(--abxy-zone);
  z-index: 20;
}

.face-btn {
  position: absolute;
  width: var(--face-btn-size);
  height: var(--face-btn-size);
  font-size: clamp(16px, 3vh, 22px);
}

#btn-y { top: 0; left: 50%; transform: translateX(-50%); color: var(--yellow); }
#btn-a { bottom: 0; left: 50%; transform: translateX(-50%); color: var(--green); }
#btn-x { left: 0; top: 50%; transform: translateY(-50%); color: var(--blue); }
#btn-b { right: 0; top: 50%; transform: translateY(-50%); color: var(--red); }

/* BUMPERS & TRIGGERS & CENTER BUTTONS (Small Face Buttons) */
.small-btn {
  position: absolute;
  width: var(--small-btn-size);
  height: var(--small-btn-size);
  font-size: clamp(9px, 1.5vh, 12px);
  z-index: 20;
}

/* Left side small buttons */
#btn-lt { top: 18%; left: 38%; }
#btn-lb { top: 40%; left: 40%; }

/* Right side small buttons */
#btn-rt { top: 18%; right: 38%; }
#btn-rb { top: 40%; right: 40%; }

/* Center small buttons */
#btn-back { bottom: 35%; left: 45%; }
#btn-start { bottom: 35%; right: 45%; }
#btn-home { 
  top: max(25px, 6vh); 
  left: 50%; 
  transform: translateX(-50%);
  background: white; 
  color: var(--green); 
  border: 2px solid var(--green);
  font-size: 16px;
}

.icon-svg {
  width: 50%;
  height: 50%;
  stroke: white;
}
</style>
</head>

<body>

<div id="status" class="disconnected">offline</div>

<div id="connection-panel">
  <div id="connection-card">
    <div class="connection-title">CONNECT TO PC</div>
    <div class="connection-subtitle">Enter your PC's local IP address and port.</div>
    <input id="pc-address" type="text" inputmode="url" autocomplete="off" placeholder="192.168.1.100:5000">
    <div class="connection-actions">
      <button id="connect-btn" type="button">CONNECT</button>
      <button id="close-connect-btn" type="button">CLOSE</button>
    </div>
    <div id="connection-help">Phone and PC must be on the same Wi-Fi network.</div>
  </div>
</div>

<div id="rotate-overlay">
  <p>Rotate your phone to landscape<br>to use the controller</p>
</div>

<div id="app">

  <!-- LEFT STICK -->
  <div class="stick-zone" id="stick-left">
    <div class="stick-thumb" id="thumb-left"></div>
  </div>

  <!-- DPAD -->
  <div class="dpad">
    <div class="dpad-cross">
      <div class="dpad-btn dpad-up" data-btn="DPAD_UP"></div>
      <div class="dpad-btn dpad-down" data-btn="DPAD_DOWN"></div>
      <div class="dpad-btn dpad-left" data-btn="DPAD_LEFT"></div>
      <div class="dpad-btn dpad-right" data-btn="DPAD_RIGHT"></div>
    </div>
  </div>

  <!-- LEFT BUMPERS / TRIGGERS -->
  <div class="btn-round small-btn" id="btn-lt" data-btn="LT">LT</div>
  <div class="btn-round small-btn" id="btn-lb" data-btn="LB">LB</div>

  <!-- CENTER BUTTONS -->
  <div class="btn-round small-btn" id="btn-back" data-btn="BACK">
    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke-width="2">
      <rect x="3" y="6" width="18" height="12" rx="2"/>
    </svg>
  </div>
  <div class="btn-round small-btn" id="btn-home" data-btn="HOME">X</div>
  <div class="btn-round small-btn" id="btn-start" data-btn="START">
    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
      <line x1="4" y1="7" x2="20" y2="7"/>
      <line x1="4" y1="12" x2="20" y2="12"/>
      <line x1="4" y1="17" x2="20" y2="17"/>
    </svg>
  </div>

  <!-- RIGHT BUMPERS / TRIGGERS -->
  <div class="btn-round small-btn" id="btn-rt" data-btn="RT">RT</div>
  <div class="btn-round small-btn" id="btn-rb" data-btn="RB">RB</div>

  <!-- RIGHT STICK -->
  <div class="stick-zone" id="stick-right">
    <div class="stick-thumb" id="thumb-right"></div>
  </div>

  <!-- ABXY -->
  <div class="face-diamond">
    <div class="btn-round face-btn" id="btn-y" data-btn="Y">Y</div>
    <div class="btn-round face-btn" id="btn-x" data-btn="X">X</div>
    <div class="btn-round face-btn" id="btn-a" data-btn="A">A</div>
    <div class="btn-round face-btn" id="btn-b" data-btn="B">B</div>
  </div>

</div>

<!-- socket.io library -->
<script src="./socket.io.min.js"></script>

<script>
const statusEl = document.getElementById('status');
const connectionPanel = document.getElementById('connection-panel');
const pcAddressInput = document.getElementById('pc-address');
const connectBtn = document.getElementById('connect-btn');
const closeConnectBtn = document.getElementById('close-connect-btn');
let socket = null;

/* ---------------------------
   SERVER ADDRESS
---------------------------- */
function normalizeServerAddress(value){
  value = (value || '').trim();
  if(!value) return '';
  if(!/^https?:\/\//i.test(value)){
    value = 'http://' + value;
  }
  try {
    const u = new URL(value);
    if(!u.port) u.port = '5000';
    return u.origin;
  } catch {
    return '';
  }
}

/* ---------------------------
   CONNECTION STATUS
---------------------------- */
function setOffline(){
  statusEl.textContent = 'offline';
  statusEl.className = 'disconnected';
}

function connectToPC(){
  const address = normalizeServerAddress(pcAddressInput.value);

  if(!address || typeof io !== 'function'){
    statusEl.textContent = 'set PC';
    statusEl.className = 'disconnected';
    connectionPanel.classList.add('open');
    return;
  }

  localStorage.setItem('controller_pc_address', address);

  if(socket){
    try{ socket.disconnect(); } catch(_){}
  }

  statusEl.textContent = 'connecting';
  statusEl.className = '';

  socket = io(address, {
    transports: ['websocket', 'polling'],
    reconnection: true,
    reconnectionAttempts: Infinity,
    timeout: 5000
  });

  socket.on('connect', () => {
    statusEl.textContent = 'connected';
    statusEl.className = 'connected';
    connectionPanel.classList.remove('open');
  });

  socket.on('disconnect', setOffline);

  socket.on('connect_error', () => {
    statusEl.textContent = 'check PC';
    statusEl.className = 'disconnected';
  });
}

/* ---------------------------
   CONNECTION WINDOW
---------------------------- */
function openConnectionPanel(){
  pcAddressInput.value = localStorage.getItem('controller_pc_address') || '';
  connectionPanel.classList.add('open');
  setTimeout(() => pcAddressInput.focus(), 50);
}

connectBtn.addEventListener('click', connectToPC);
closeConnectBtn.addEventListener('click', () => connectionPanel.classList.remove('open'));
pcAddressInput.addEventListener('keydown', e => { if(e.key === 'Enter') connectToPC(); });
statusEl.addEventListener('click', openConnectionPanel);

/* ---------------------------
   AUTO CONNECT
---------------------------- */
const savedAddress = localStorage.getItem('controller_pc_address');
if(savedAddress){
  pcAddressInput.value = savedAddress;
  connectToPC();
} else {
  statusEl.textContent = 'set PC';
  statusEl.className = 'disconnected';
}

/* ---------------------------
   SAFE EMIT
---------------------------- */
function emit(event, data){
  if(socket && socket.connected){
    socket.emit(event, data);
  }
}

/* ---------------------------
   NORMAL BUTTONS
---------------------------- */
function wireButton(el, sendName){
  const press = e => {
    e.preventDefault();
    el.classList.add('active');
    emit('button', { name: sendName, pressed: true });
  };
  const release = e => {
    e.preventDefault();
    el.classList.remove('active');
    emit('button', { name: sendName, pressed: false });
  };

  el.addEventListener('touchstart', press, {passive:false});
  el.addEventListener('touchend', release, {passive:false});
  el.addEventListener('touchcancel', release, {passive:false});
  el.addEventListener('mousedown', press);
  el.addEventListener('mouseup', release);
  el.addEventListener('mouseleave', release);
}

document.querySelectorAll('[data-btn]').forEach(el => {
  const name = el.dataset.btn;

  /* TRIGGERS */
  if (name === 'LT' || name === 'RT') {
    const side = name === 'LT' ? 'left' : 'right';
    const press = e => {
      e.preventDefault();
      el.classList.add('active');
      emit('trigger', { side: side, value: 1.0 });
    };
    const release = e => {
      e.preventDefault();
      el.classList.remove('active');
      emit('trigger', { side: side, value: 0.0 });
    };

    el.addEventListener('touchstart', press, {passive:false});
    el.addEventListener('touchend', release, {passive:false});
    el.addEventListener('touchcancel', release, {passive:false});
    el.addEventListener('mousedown', press);
    el.addEventListener('mouseup', release);
    el.addEventListener('mouseleave', release);
  } else {
    wireButton(el, name);
  }
});

/* ---------------------------
   ANALOG STICKS
---------------------------- */
function setupStick(zoneId, thumbId, side){
  const zone = document.getElementById(zoneId);
  const thumb = document.getElementById(thumbId);
  let dragging = false;
  let moved = false;

  function radius() { return zone.clientWidth / 2; }

  function updateThumb(dx, dy) {
    const r = radius();
    const dist = Math.min(Math.hypot(dx, dy), r - 8);
    const angle = Math.atan2(dy, dx);
    const cx = Math.cos(angle) * dist;
    const cy = Math.sin(angle) * dist;

    thumb.style.transform = `translate(calc(-50% + ${cx}px), calc(-50% + ${cy}px))`;
    
    emit('stick', {
      side: side,
      x: cx / (r - 8),
      y: -cy / (r - 8)
    });
  }

  function resetThumb() {
    thumb.style.transform = 'translate(-50%,-50%)';
    emit('stick', { side: side, x: 0, y: 0 });
  }

  function getRelative(clientX, clientY) {
    const rect = zone.getBoundingClientRect();
    return {
      dx: clientX - (rect.left + rect.width / 2),
      dy: clientY - (rect.top + rect.height / 2)
    };
  }

  function start(x, y) {
    dragging = true;
    moved = false;
    zone.classList.add('dragging');
    const { dx, dy } = getRelative(x, y);
    updateThumb(dx, dy);
  }

  function move(x, y) {
    if(!dragging) return;
    moved = true;
    const { dx, dy } = getRelative(x, y);
    updateThumb(dx, dy);
  }

  function end() {
    if(dragging && !moved) {
      const btnName = side === 'left' ? 'LS' : 'RS';
      emit('button', { name: btnName, pressed: true });
      setTimeout(() => { emit('button', { name: btnName, pressed: false }); }, 80);
    }
    dragging = false;
    zone.classList.remove('dragging');
    resetThumb();
  }

  zone.addEventListener('touchstart', e => {
    e.preventDefault();
    start(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:false});

  zone.addEventListener('touchmove', e => {
    e.preventDefault();
    move(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:false});

  zone.addEventListener('touchend', e => { e.preventDefault(); end(); }, {passive:false});
  zone.addEventListener('touchcancel', e => { e.preventDefault(); end(); }, {passive:false});
  zone.addEventListener('mousedown', e => { start(e.clientX, e.clientY); });
  
  window.addEventListener('mousemove', e => { if(dragging) move(e.clientX, e.clientY); });
  window.addEventListener('mouseup', () => { if(dragging) end(); });
}

/* Initialize BOTH sticks to map reference image perfectly */
setupStick('stick-left', 'thumb-left', 'left');
setupStick('stick-right', 'thumb-right', 'right');

/* ---------------------------
   PREVENT PAGE MOVEMENT
---------------------------- */
document.addEventListener('touchmove', e => e.preventDefault(), {passive:false});
document.addEventListener('gesturestart', e => e.preventDefault());

/* TRY LANDSCAPE */
if(screen.orientation && screen.orientation.lock) {
  screen.orientation.lock('landscape').catch(() => {});
}
</script>

</body>
</html>
